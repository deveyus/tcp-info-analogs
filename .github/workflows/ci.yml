name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all tests (all platform decoders execute on every host)
        run: cargo test --all-targets --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: Verify MSRV (1.77.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.77.0
      # Benches live in a separate workspace member whose iai-callgrind
      # chain needs 1.81; the main package carries the MSRV guarantee.
      - run: cargo check -p tcp-info-analogs --lib --tests --all-features --locked
      - run: cargo test -p tcp-info-analogs --lib --tests --all-features --locked

  benches:
    name: Instruction-count baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runner matching iai-callgrind lib version
        run: cargo install iai-callgrind-runner --version 0.16.1
      - name: Run benchmarks (record-or-compare via workflow_dispatch inputs)
        run: cargo bench -p tcp-info-benches --bench decode
